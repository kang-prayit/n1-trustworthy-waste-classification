# Conda environment matching the recorded evaluation environment of the paper
# (Python 3.13, PyTorch 2.11.0 + CUDA 13.0, timm 1.0.30). Only these versions and imagehash 4.3.2 were
# recorded; everything else is left unpinned.
#   conda env create -f environment.yml && conda activate n1-waste
name: n1-waste
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - numpy
  - pandas
  - scikit-learn
  - scipy
  - pillow
  - matplotlib
  - pyyaml
  - tqdm
  - pytest
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.11.0
      - torchvision          # version not recorded; pip picks the one matching torch 2.11.0
      - timm==1.0.30
      - imagehash==4.3.2
